<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Moniteur Virtual Cam Pro - V5</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; margin: 0; padding: 0; background: #5b9bd5; height: 100vh; overflow: hidden; color: white; }
        .main-container { display: flex; width: 100vw; height: 100vh; padding: 15px; gap: 15px; }
        .video-zone { flex: 1.3; background: #111; border-radius: 40px; border: 3px solid #1f4e79; overflow: hidden; display: flex; align-items: center; justify-content: center; position: relative; }
        #video-preview { width: 100%; height: 100%; object-fit: contain; background: #000; }
        .control-zone { flex: 0.7; display: flex; flex-direction: column; justify-content: space-between; padding: 5px 0; }
        .data-box { background: rgba(0, 0, 0, 0.85); border: 2px solid #aaa; padding: 12px; border-radius: 8px; font-family: monospace; font-size: 0.85rem; line-height: 1.5; text-align: left; }
        .data-box-title { border-bottom: 1px solid #555; padding-bottom: 6px; margin-bottom: 8px; font-weight: bold; color: #ddd; }
        .buttons-zone { display: flex; justify-content: center; align-items: center; gap: 40px; margin-bottom: 20px; }
        .round-btn { position: relative; width: 75px; height: 75px; border-radius: 50%; border: 4px solid white; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.4); transition: transform 0.1s; }
        .round-btn:active { transform: scale(0.92); }
        #btn-rec { background: #ff0000; color: white; }
        .txt-vert-fluo { color: #39ff14; text-shadow: 0 0 8px #39ff14; }
        .pause-icon { display: none; width: 22px; height: 26px; justify-content: space-between; }
        .pause-bar { width: 8px; height: 100%; background: #ffa500; border-radius: 2px; }
        .clignote-orange .pause-bar { animation: blinkOrange 1s infinite; }
        @keyframes blinkOrange { 50% { background: #ff4500; } }
        .btn-reset { width: 65px; height: 65px; border-radius: 50%; background: #222; border: 4px solid #666; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .btn-reset.actif { border-color: #39ff14; background: #111; }
        .btn-reset svg { width: 30px; height: 30px; fill: #666; }
        .btn-reset.actif svg { fill: #39ff14; }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="video-zone">
            <video id="video-preview" autoplay playsinline muted></video>
        </div>

        <div class="control-zone">
            <div class="data-box">
                <div class="data-box-title">Données vers Drive (30Hz) :</div>
                <div id="live-data">
                    LIGNE CIBLE : 1 <br>
                    ACCEL X: 0.0 | Y: 0.0 | Z: 0.0<br>
                    ROTATION A: 0° | B: 0° | G: 0°
                </div>
            </div>

            <div class="buttons-zone">
                <div id="btn-rec" class="round-btn"><span id="label-rec">REC</span>
                    <div id="icon-pause" class="pause-icon"><div class="pause-bar"></div><div class="pause-bar"></div></div>
                </div>
                <div id="btn-reset" class="btn-reset actif">
                    <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                </div>
            </div>
        </div>
    </div>

    <script>
        const URL_GOOGLE_SCRIPT = "https://script.google.com/macros/s/AKfycbw-lcalrUOemS1w3DgSnKKHNHrMHnn6QV-dyQs1Eix_Ih1gRSoLs4vzd8yY7usnGS7s/exec";

        let etatCourant = "STOPPED"; 
        let intervalId = null;
        let indexPoint = 1;
        let resetActif = true; 
        let mesuresCourantes = { x: 0, y: 0, z: 0, alpha: 0, beta: 0, gamma: 0 };

        const video = document.getElementById('video-preview');
        const btnRec = document.getElementById('btn-rec');
        const labelRec = document.getElementById('label-rec');
        const iconPause = document.getElementById('icon-pause');
        const btnReset = document.getElementById('btn-reset');
        const liveDataDisplay = document.getElementById('live-data');

        // 🔥 FORCE L'ACCÈS MATÉRIEL DE MANIÈRE UNIVERSELLE
        function initialiserMedia() {
            navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment" },
                audio: false
            })
            .then((stream) => {
                video.srcObject = stream;
                video.setAttribute('playsinline', 'true');
                video.setAttribute('muted', 'true');
                video.play().catch(e => console.log("Play bloqué:", e));
            })
            .catch((err) => {
                alert("Erreur Caméra. Vérifiez les permissions du site : " + err.name);
            });
        }

        // Lancement immédiat au chargement
        window.addEventListener('DOMContentLoaded', initialiserMedia);

        // Capteurs
        window.addEventListener('devicemotion', (e) => {
            const acc = e.accelerationIncludingGravity;
            if (acc) {
                mesuresCourantes.x = acc.x || 0;
                mesuresCourantes.y = acc.y || 0;
                mesuresCourantes.z = acc.z || 0;
                rafraichirVisuel();
            }
        });

        window.addEventListener('deviceorientation', (e) => {
            mesuresCourantes.alpha = e.alpha || 0;
            mesuresCourantes.beta = e.beta || 0;
            mesuresCourantes.gamma = e.gamma || 0;
            rafraichirVisuel();
        });

        btnReset.addEventListener('click', () => {
            resetActif = !resetActif;
            if (resetActif) { btnReset.classList.add('actif'); if (etatCourant === "PAUSED" || etatCourant === "STOPPED") { indexPoint = 1; } }
            else { btnReset.classList.remove('actif'); }
            rafraichirVisuel();
        });

        btnRec.addEventListener('click', () => {
            // Plein écran standard
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
            }

            if (etatCourant === "STOPPED" || etatCourant === "PAUSED") {
                if (resetActif && etatCourant === "STOPPED") { indexPoint = 1; }
                etatCourant = "RECORDING";
                
                labelRec.style.display = "block";
                iconPause.style.display = "none";
                labelRec.className = "txt-vert-fluo";
                btnRec.className = "round-btn"; 

                intervalId = setInterval(() => {
                    const payload = { index: indexPoint, ...mesuresCourantes };
                    envoyerDonnees(payload);
                    indexPoint++;
                    rafraichirVisuel();
                }, 33.3);

            } else if (etatCourant === "RECORDING") {
                etatCourant = "PAUSED";
                clearInterval(intervalId); 
                if (resetActif) { indexPoint = 1; }
                labelRec.style.display = "none";
                iconPause.style.display = "flex";
                btnRec.className = "round-btn clignote-orange";
            }
            rafraichirVisuel();
        });

        function rafraichirVisuel() {
            let ligneCible = (resetActif && etatCourant === "STOPPED") ? 1 : indexPoint;
            liveDataDisplay.innerHTML = `
                <strong>LIGNE CIBLE :</strong> ${ligneCible} <br>
                <strong>ACCEL :</strong> X: ${mesuresCourantes.x.toFixed(1)} | Y: ${mesuresCourantes.y.toFixed(1)} | Z: ${mesuresCourantes.z.toFixed(1)} <br>
                <strong>ROTATION :</strong> A: ${mesuresCourantes.alpha.toFixed(0)}° | B: ${mesuresCourantes.beta.toFixed(0)}° | G: ${mesuresCourantes.gamma.toFixed(0)}°
            `;
        }

        function envoyerDonnees(donnees) {
            fetch(URL_GOOGLE_SCRIPT, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(donnees)
            }).catch(err => console.error(err));
        }
    </script>
</body>
</html>
