<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Moniteur Virtual Cam Pro - V11.5 (Firebase Realtime)</title>
    <!-- Chargement des SDK Firebase Web (Modular Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; background: #5b9bd5; font-family: -apple-system, sans-serif; height: 100%; min-height: -webkit-fill-available; color: white; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        
        /* Conteneur principal */
        .main-container { display: flex; flex-direction: column; width: 100%; max-width: 450px; height: 100vh; height: -webkit-fill-available; padding: 8px; gap: 6px; justify-content: space-between; }
        
        /* Zone vidéo */
        .video-zone { flex: 2; background: #000; border-radius: 18px; border: 2px solid #1f4e79; overflow: hidden; display: flex; align-items: center; justify-content: center; min-height: 0; position: relative; }
        #video-preview { width: 100%; height: 100%; object-fit: cover; }
        
        /* Bandeau d'alerte de calibration clignotant */
        @keyframes blink-red {
            0% { background-color: rgba(255, 0, 0, 0.9); color: #ffffff; }
            50% { background-color: rgba(128, 0, 0, 0.9); color: #ffffff; }
            100% { background-color: rgba(255, 0, 0, 0.9); color: #ffffff; }
        }
        #calib-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 10;
            animation: blink-red 0.5s infinite;
            font-weight: bold;
            font-size: 1.1rem;
            text-align: center;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: inset 0 0 20px #000;
        }

        /* Zone de contrôle */
        .right-panel { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }

        /* Zone d'information */
        .data-box { background: #000; border: 1.5px solid #888; padding: 6px 8px; border-radius: 6px; font-family: monospace; font-size: 0.75rem; line-height: 1.3; display: flex; flex-direction: column; justify-content: center; }
        .data-box-title { border-bottom: 1px solid #444; padding-bottom: 2px; margin-bottom: 3px; font-weight: bold; color: #ddd; font-size: 0.75rem; }
        
        /* Zone des boutons */
        .buttons-zone { display: flex; justify-content: space-around; align-items: center; width: 100%; padding: 2px 0; gap: 8px; }
        .round-btn { position: relative; width: 40px; height: 40px; border-radius: 50%; border: 2px solid white; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.4); transition: transform 0.1s; color: white; flex-shrink: 0; }
        .round-btn:active { transform: scale(0.92); }
        #btn-reset { background: linear-gradient(135deg, #11998e, #38ef7d); }
        #btn-reset.actif { background: #39ff14; box-shadow: 0 0 10px #39ff14; }
        #btn-reset svg { width: 16px; height: 16px; fill: white; }
        #btn-rec { background: #ff0000; }
        .pause-icon { display: none; width: 12px; height: 14px; justify-content: space-between; }
        .pause-bar { width: 4px; height: 100%; background: #ffa500; border-radius: 1px; }
        #btn-stop { background: linear-gradient(135deg, #777, #333); border-color: #bbb; }
        .stop-core { width: 26px; height: 26px; border-radius: 50%; background: linear-gradient(135deg, #d9534f, #c9302c); display: flex; align-items: center; justify-content: center; border: 1.5px solid #fff; font-size: 7px; font-weight: bold; }
        #status-text { font-weight: bold; color: #ffca28; margin-top: 2px; font-size: 0.7rem; }

        /* Adaptatif orientation paysage Samsung */
        @media (orientation: landscape) {
            .main-container { flex-direction: row; max-width: 100%; padding: 6px; gap: 8px; }
            .video-zone { flex: 1.8; height: 100%; border-radius: 12px; }
            .right-panel { flex: 1; display: flex; flex-direction: column; justify-content: space-between; height: 100%; min-height: 0; }
            .data-box { flex: 1; padding: 6px; font-size: 0.7rem; min-height: 0; overflow: hidden; }
            .buttons-zone { flex-shrink: 0; padding-bottom: 0; }
            .round-btn { width: 36px; height: 36px; font-size: 9px; }
            .stop-core { width: 22px; height: 22px; font-size: 6px; }
            #btn-reset svg { width: 14px; height: 14px; }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="video-zone">
            <video id="video-preview" autoplay playsinline muted></video>
            <!-- Overlay clignotant durant la calibration -->
            <div id="calib-overlay">⚠️ STABILISEZ LE TÉLÉPHONE<br><small style="font-size: 0.7rem; margin-top: 5px;">CALIBRATION GRAVITÉ EN COURS...</small></div>
        </div>
        <div class="right-panel">
            <div class="data-box">
                <div id="title-version" class="data-box-title">Données de session (30Hz) :</div>
                <div id="live-data">LIGNE INTERNE : 1 <br>AC: X: +0.00 | Y: +0.00 | Z: +0.00<br>ROT A:   0° | B:   0° | G:   0°<br>Flux : Firebase Realtime</div>
                <div id="status-text">Status : Prêt</div>
            </div>
            <div class="buttons-zone">
                <div id="btn-reset" class="round-btn">
                    <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                </div>
                <div id="btn-rec" class="round-btn">
                    <span id="label-rec">REC</span>
                    <div id="icon-pause" class="pause-icon"><div class="pause-bar"></div><div class="pause-bar"></div></div>
                </div>
                <div id="btn-stop" class="round-btn"><div class="stop-core">STOP</div></div>
            </div>
        </div>
    </div>

<script>
    const VERSION_APP = "V11.5 (Firebase)";

    // VOS IDENTIFIANTS FIREBASE INTÉGRÉS
    const firebaseConfig = {
      apiKey: "AIzaSyA_3N54LwJVYI4PRtR1XDvkn_v8WEH5rk0",
      authDomain: "data-capteurs-phone.firebaseapp.com",
      databaseURL: "https://data-capteurs-phone-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "data-capteurs-phone",
      storageBucket: "data-capteurs-phone.firebasestorage.app",
      messagingSenderId: "878248473706",
      appId: "1:878248473706:web:48d1c717bfba6b77020613",
      measurementId: "G-CBGZ3433JC"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const sessionRef = db.ref("session_courante");

    let curX = 0, curY = 0, curZ = 0;
    let curA = 0, curB = 0, curG = 0;
    let orient = "PORTRAIT";

    let indexPoint = 1;
    let intervalId = null;
    let etatCourant = "STOPPED"; // Etats : STOPPED, CALIBRATING, RECORDING, PAUSED
    let hardwareDemarre = false;

    window.onerror = function(msg, url, line) {
        alert("Bug détecté à la ligne " + line + " : " + msg);
        return false;
    };

    const liveDataDisplay = document.getElementById("live-data");
    const statusText = document.getElementById("status-text");
    const calibOverlay = document.getElementById("calib-overlay");
    const btnRec = document.getElementById("btn-rec");
    const btnStop = document.getElementById("btn-stop");
    const btnReset = document.getElementById("btn-reset");
    const labelRec = document.getElementById("label-rec");
    const iconPause = document.getElementById("icon-pause");

    window.onload = async () => {
        const titleBox = document.getElementById('title-version');
        if (titleBox) {
            titleBox.innerText = "Données de session (30Hz) [" + VERSION_APP + "] :";
        }

        statusText.innerText = "Status : Connexion Firebase...";
        btnRec.style.background = "#555555";
        btnRec.style.opacity = "0.5";
        btnRec.style.pointerEvents = "none";

        await demarrerHardwarePhysique();

        sessionRef.child("meta/dernier_index").once('value')
            .then(snapshot => {
                let val = snapshot.val();
                indexPoint = val ? parseInt(val) + 1 : 1;
                libererBoutonRec("Firebase Connecté ✓");
            })
            .catch(() => {
                indexPoint = 1;
                libererBoutonRec("Firebase (Prêt) ✓");
            });
    };

    function libererBoutonRec(message) {
        btnRec.style.background = "#ff0000";
        btnRec.style.opacity = "1";
        btnRec.style.pointerEvents = "auto";
        statusText.innerText = "Status : " + message;
        rafraichirVisuel();
    }

    async function demarrerHardwarePhysique() {
        if (hardwareDemarre) return;

        try {
            const contraintes = {
                video: { facingMode: "environment" },
                audio: false
            };
            const stream = await navigator.mediaDevices.getUserMedia(contraintes);
            const videoElement = document.getElementById('video-preview');
            if (videoElement) {
                videoElement.srcObject = stream;
                videoElement.setAttribute('playsinline', true);
                videoElement.setAttribute('webkit-playsinline', true);
                await videoElement.play().catch(e => console.log("Play bloqué:", e));
            }
        } catch (err) {
            console.warn("Alerte Caméra : " + err.message);
        }

        window.addEventListener('devicemotion', (e) => {
            const acc = e.accelerationIncludingGravity;
            if (acc) {
                curX = acc.x || 0;
                curY = acc.y || 0;
                curZ = acc.z || 0;
                rafraichirVisuel();
            }
        }, true);

        window.addEventListener('deviceorientation', (e) => {
            curA = e.alpha || 0;
            curB = e.beta || 0;
            curG = e.gamma || 0;
            rafraichirVisuel();
        }, true);

        const verifierOrientation = () => {
            if (window.screen && window.screen.orientation) {
                orient = window.screen.orientation.type.includes("portrait") ? "PORTRAIT" : "LANDSCAPE";
            } else {
                orient = (window.innerHeight > window.innerWidth) ? "PORTRAIT" : "LANDSCAPE";
            }
        };
        window.addEventListener('orientationchange', verifierOrientation);
        verifierOrientation();

        hardwareDemarre = true;
    }

    btnRec.addEventListener('click', async () => {
        if (!hardwareDemarre) {
            await demarrerHardwarePhysique();
        }

        if (etatCourant === "STOPPED") {
            // PHASE 1 : SÉCURITÉ CALIBRATION ROUGE CLIGNOTANT (1.5 SECONDES)
            etatCourant = "CALIBRATING";
            
            calibOverlay.style.display = "flex";
            statusText.innerText = "Status : STABILISATION (1.5s)...";
            btnRec.style.pointerEvents = "none";
            btnRec.style.opacity = "0.6";

            setTimeout(() => {
                // PHASE 2 : DÉMARRAGE EFFECTIF DE L'ENREGISTREMENT
                calibOverlay.style.display = "none";
                btnRec.style.pointerEvents = "auto";
                btnRec.style.opacity = "1";
                
                etatCourant = "RECORDING";
                labelRec.style.display = "none";
                iconPause.style.display = "none";
                btnRec.className = "round-btn";
                btnRec.style.background = "#222222"; 

                statusText.innerText = "Status : Enregistrement Firebase (30Hz)...";
                demarrerCaptureFlux();
            }, 1500);
        } 
        else if (etatCourant === "PAUSED") {
            // Reprise directe après pause (sans recalibration)
            etatCourant = "RECORDING";
            labelRec.style.display = "none";
            iconPause.style.display = "none";
            btnRec.className = "round-btn";
            btnRec.style.background = "#222222"; 

            statusText.innerText = "Status : Enregistrement Firebase (30Hz)...";
            demarrerCaptureFlux();
        }
        else if (etatCourant === "RECORDING") {
            etatCourant = "PAUSED";

            if (intervalId !== null) {
                clearInterval(intervalId);
                intervalId = null;
            }

            labelRec.style.display = "none";
            iconPause.style.display = "flex";
            btnRec.className = "round-btn";
            btnRec.style.background = "#ff0000";

            statusText.innerText = "Status : Session en pause";
            rafraichirVisuel();
        }
    });

    btnStop.addEventListener('click', () => {
        if (etatCourant === "RECORDING" || etatCourant === "PAUSED" || etatCourant === "CALIBRATING") {
            if (intervalId !== null) {
                clearInterval(intervalId);
                intervalId = null;
            }
            
            calibOverlay.style.display = "none";
            btnRec.style.pointerEvents = "auto";
            btnRec.style.opacity = "1";
            
            etatCourant = "STOPPED";
            
            sessionRef.child("meta").update({
                dernier_index: indexPoint - 1,
                date_fin: new Date().toISOString()
            });

            labelRec.style.display = "block";
            iconPause.style.display = "none";
            btnRec.className = "round-btn";
            btnRec.style.background = "#ff0000";

            statusText.innerText = "Status : Session enregistrée sur Firebase ✓";
            rafraichirVisuel();
        }
    });

    btnReset.addEventListener('click', () => {
        if (etatCourant === "PAUSED" || etatCourant === "STOPPED") {
            statusText.innerText = "Status : Purge Firebase en cours...";

            if (intervalId !== null) {
                clearInterval(intervalId);
                intervalId = null;
            }

            indexPoint = 1;
            btnReset.style.pointerEvents = "none";

            sessionRef.remove()
                .then(() => {
                    statusText.innerText = "Status : Firebase réinitialisé ✓";
                    btnReset.style.pointerEvents = "auto";
                    rafraichirVisuel();
                })
                .catch(err => {
                    console.error(err);
                    statusText.innerText = "Status : Échec Purge Firebase ⚠";
                    btnReset.style.pointerEvents = "auto";
                    rafraichirVisuel();
                });
        }
    });

    function demarrerCaptureFlux() {
        if (intervalId !== null) clearInterval(intervalId);

        intervalId = setInterval(() => {
            if (etatCourant !== "RECORDING") return;

            let timestamp = new Date().toISOString();
            
            sessionRef.child("points/" + indexPoint).set({
                index: indexPoint,
                timestamp: timestamp,
                acc_x: curX, 
                acc_y: curY, 
                acc_z: curZ,
                alpha: curA, 
                beta: curB, 
                gamma: curG,
                mode: orient
            });

            indexPoint++;
            rafraichirVisuel();
        }, 1000 / 30);
    }

    function formatNum(val, dec, totalWidth) {
        let n = Number(val) || 0;
        let str = (n >= 0 ? "+" : "") + n.toFixed(dec);
        return str.padStart(totalWidth, ' ');
    }

    function rafraichirVisuel() {
        if (liveDataDisplay) {
            let strX = formatNum(curX, 2, 6);
            let strY = formatNum(curY, 2, 6);
            let strZ = formatNum(curZ, 2, 6);
            let strA = formatNum(curA, 0, 4);
            let strB = formatNum(curB, 0, 4);
            let strG = formatNum(curG, 0, 4);

            liveDataDisplay.innerHTML = 
                "Index Global : <b>" + indexPoint + "</b><br>" +
                "AC: X:" + strX + " | Y:" + strY + " | Z:" + strZ + "<br>" +
                "ROT A:" + strA + "° | B:" + strB + "° | G:" + strG + "° [" + orient + "]<br>" +
                "Flux : <b>Firebase Realtime 🚀</b>";
        }
    }
</script>
</body>
</html>
